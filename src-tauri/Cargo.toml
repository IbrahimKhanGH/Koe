[package]
name = "koe-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "koe_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
koe-core = { path = "../crates/koe-core" }
koe-ipc = { path = "../crates/koe-ipc" }
koe-audio = { path = "../crates/koe-audio" }
koe-asr = { path = "../crates/koe-asr" }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "windows")'.dependencies]
# Clipboard for the Windows paste path (macOS uses NSPasteboard directly).
arboard = "3"
# Windows platform layer (low-level keyboard hook, SendInput paste, foreground-app
# detection). UNVERIFIED: written on macOS, never compiled or run on Windows.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
] }

[target.'cfg(target_os = "macos")'.dependencies]
macos-accessibility-client = "0.0.1"
# Frontmost-app detection (paste-target → per-app cleanup formatting). Already in
# the tree via Tauri; declared here so we can call NSWorkspace directly.
# NSPasteboard: the paste writes a this-Mac-only, concealed clipboard item and
# restores the previous clipboard (all types, not just text) afterwards.
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSArray"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat"] }
# Obj-C block support + the objc2 runtime `Bool`, for the AVCaptureDevice
# mic-permission completion handler in paste.rs. Versions match what the objc2
# framework crates already resolve to.
block2 = "0.6"
objc2 = "0.6"
