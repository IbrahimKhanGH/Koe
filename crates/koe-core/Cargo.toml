[package]
name = "koe-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The shared, platform-agnostic brain: dictation state machine, session pipeline
# orchestration, ASR/cleanup trait seams, dictionary, settings, storage. The native
# and ML backends plug in behind traits defined here.
[dependencies]
koe-ipc = { path = "../koe-ipc" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
strsim = "0.11"
# SHA-256 of model files before they are loaded (see models.rs). "asm" turns on
# the Apple Silicon SHA-2 instructions: ~5x faster, which matters when every
# launch hashes several GB of models.
sha2 = { version = "0.10", features = ["asm"] }
